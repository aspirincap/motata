[project]
name = "motata-cli"
version = "0.2.0"
description = "Motata CLI for Meta ad delivery, discovery, validation, migration, and TikTok operations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.0,<5",
  "requests>=2.31.0,<3",
  "six>=1.16.0,<2",
  "certifi>=2023.7.22",
  "urllib3>=1.26.18,<3",
]

[project.optional-dependencies]
gateway = [
  "PyJWT[crypto]>=2.13.0,<3",
  "cryptography>=46.0.4,<47",
  "httpx>=0.28.1,<0.29",
  "pydantic>=2.13.4,<3",
  "uvicorn>=0.48.0,<0.49",
]

[project.scripts]
motata = "motata_cli.__main__:main"
motata-gateway = "motata_gateway.__main__:main"
motata-gateway-admin = "motata_gateway.admin:main"
motata-handoff = "motata_cli.handoff:main"
motata-token = "motata_cli.auth_center.fetch_token:main"
motata-auth-center-token = "motata_cli.auth_center.fetch_token:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
motata_cli = ["skills_compatibility.json", "_vendor/NOTICE.md", "_vendor/tiktok_business_api_sdk/LICENSE"]

[tool.setuptools.packages.find]
include = ["motata_cli*", "motata_gateway*"]
